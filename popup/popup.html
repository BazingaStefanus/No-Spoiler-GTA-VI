<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>No Spoiler for GTA VI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>No Spoiler for GTA VI</h1>

  <label class="row">
    <input type="checkbox" id="enabled">
    <span>Spoiler protection on</span>
  </label>

  <label class="row" id="siteRow">
    <input type="checkbox" id="site">
    <span>Active on <strong id="host">this site</strong></span>
  </label>
  <p class="hint" id="hint"></p>

  <button id="options" type="button">Settings</button>

  <script src="../src/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
